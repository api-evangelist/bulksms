aid: bulksms

name: BulkSMS

image: https://www.bulksms.com/images/share/bulksms-social-share-2026.jpg

description: BulkSMS provides a business SMS platform enabling companies to send, receive and manage text messages globally. With over 25 years
  in business messaging, they support 180+ countries, 800+ local networks, and offer features like web-to-SMS, shortcodes, long numbers, RCS messaging,
  and integrations via REST, legacy EAPI, and SMPP. Their API allows developers to automate notifications, alerts, and marketing campaigns, backed
  by robust pricing, compliance, and support resources.

