      summary: Send message by simple GET or POST
      description: |
        A simple interface for sending a single message via GET.

        This is a convenience method, recommended for debugging or quick tests. It allows you to send a message from the browser address bar.

        For example:
        ```http
        GET /v1/messages/send?to=%2b270000000&body=Hello%20World
        ```

        You can also POST the same parameters as form-encoded fields to the [Send Messages](#tag/message/POST/messages) endpoint:
        ```http
        POST /v1/messages
        Content-Type: application/x-www-form-urlencoded

        to=%2b27000000000&body=Hello+World
        ```

        For production use, the [Send Messages](#tag/message/POST/messages) operation is recommended as it supports batch sending, templates, and scheduling.
      parameters:
