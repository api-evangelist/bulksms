openapi: '3.0.3'
info:
  title: BulkSMS JSON REST API
  version: "1.1.0"
  x-logo:
    url: /developer/images/bulksms-logo-main.svg
    backgroundColor: '#FFFFFF'
  description: |
    ## Overview

    The JSON REST API allows you to submit and receive [BulkSMS](https://www.bulksms.com/) messages. You can also get access to past messages and see your account profile.

    The base URL to use for this service is `https://api.bulksms.com/v1`.  The base URL cannot be used on its own; you must append a path that identifies an operation and you may have to specify some path parameters as well.

    [Click here](/developer/) to go to the main BulkSMS developer site.

    In order to give you an idea on how the API can be used, some JSON snippets are provided below.  Have a look at the [messages section](#tag/message) for more information.

    Probably the most simple example

    ```
    {
        "to": "+447700900000",
        "body": "Hello World!"
    }
    ```


    You can send unicode automatically using the `auto-unicode` query parameter.
    Alternatively, you can specify `UNICODE` for the `encoding` property in the request body.
    Please note: when `auto-unicode` is specified and the value of the `encoding` property is `UNICODE`, the message will always be sent as `UNICODE`.

    Here is an example that sets the `encoding` explicitly

    ```
    {
      "to": "+447700900000",
      "body": "Dobrá práce! Jak se máš?",
      "encoding": "UNICODE"
    }
    ```

    You can also specify a from number

    ```
    {
        "from": "+447911123456",
        "to": "+447700900000",
        "body": "Hello World!"
    }
    ```

    Similar to above, but repliable

    ```
    {
        "from": { "type": "REPLIABLE" },
        "to": "+447700900000",
        "body": "Hello World!"
    }
    ```

    A message to a group called Everyone

    ```
    {
        "to": { "type": "GROUP", "name": "Everyone" },
        "body": "Hello World!"
    }
    ```

    A message to multiple recipients

    ```
    {
        "to": ["+447700900000", "+447700900001", "+447700900002"],
        "body": "Happy Holidays!"
    }
    ```

    Sending more than one message in the same request

    ```
    [
        {
            "to": "+447700900000",
            "body": "Hello World!"
        },
        {
            "to": "+447700900001",
            "body": "Hello Universe!"
        }
    ]
    ```

    **The insecure base URL `http://api.bulksms.com/v1` is deprecated** and may in future result in a `301` redirect response, or insecure requests may be rejected outright. Please use the secure (`https`) URI above.

    ### HTTP Content Type

    All API methods expect requests to supply a `Content-Type` header with the value `application/json`. All responses will have the `Content-Type` header set to `application/json`.

    ### JSON Formatting

    You are advised to format your JSON resources according to strict JSON format rules. While the API does attempt to parse strictly invalid JSON documents, doing so may lead to incorrect interpretation and unexpected results.

    Good JSON libraries will produce valid JSON suitable for submission, but if you are manually generating the JSON text, be careful to follow the JSON format. This includes correct escaping of control characters and double quoting of property names.

    See the [JSON specification](https://tools.ietf.org/html/rfc4627) for further information.

    ### Date Formatting

    Dates are formatted according to ISO-8601, such as `1970-01-01T10:00:00+01:00` for 1st January 1970, 10AM UTC+1.

    See the [Wikipedia ISO 8601 reference](https://en.wikipedia.org/wiki/ISO_8601) for further information.

    Specifically, calendar dates are formatted with the 'extended' format `YYYY-MM-DD`. Basic format, week dates and ordinal dates are not supported. Times are also formatted in the 'extended' format `hh:mm:ss`. Hours, minutes and seconds are mandatory. Offset from UTC must be provided; this is to ensure that there is no misunderstanding regarding times provided to the API.

    The format we look for is `yyyy-MM-ddThh:mm:ss[Z|[+-]hh:mm]`

    Examples of valid date/times are `2011-12-31T12:00:00Z` `2011-12-31T12:00:00+02:00`

    ### Entity Format Modifications

    It is expected that over time some changes will be made to the request and response formats of various methods available in the API.
    Where possible, these will be implemented in a backwards compatible way.
    To make this possible you are required to ignore unknown properties.
    This enables the addition of information in response documents while maintaining compatibility with older clients.

    ### Optional Request Entity Properties

    There are many instances where requests can be made without having to specify every single property allowable in the request format.
    Any such optional properties are noted as such in the documentation and their default value is noted.

servers:
  - url: https://api.bulksms.com/v1
    description: Production

tags:
  - name: Authentication
    description: |
      All API requests require authentication using [HTTP Basic Auth](https://en.wikipedia.org/wiki/Basic_access_authentication) with an **API Token**.

      ### Creating an API Token

      Create a new token in your account at [Settings > Developers > API Tokens](https://www.bulksms.com/account/ui/index.html#/account/dev/api-tokens).

      ### Using the Token

      Supply the **token ID** as the username and the **token secret** as the password. The values must be [Base64 encoded](https://en.wikipedia.org/wiki/Base64) before including them in the `Authorization` header.

      For example, if the token ID is `BBDE1B476E03498AA768F66A286AABDC-01-B` and the token secret is `9jSbVDK20!MXdfRGiIIFu#ffUE8*S`, the full header becomes:

      ```
      Authorization: Basic QkJERTFCNDc2RTAzNDk4QUE3NjhGNjZBMjg2QUFCREMtMDEtQjo5alNiVkRLMjAhTVhkZlJHaUlJRnUjZmZVRTgqUw==
      ```

      ### Tips

      - Provide the `Authorization` header in every request. Do not wait for a `401` response before authenticating -- this reduces round trips and improves performance.
      - Most HTTP libraries handle Basic Auth natively. For example, with `curl`: `curl -u TOKEN_ID:TOKEN_SECRET https://api.bulksms.com/v1/messages`

      > **Username and password authentication is no longer supported.** Accounts created after 2026-04-29 can only authenticate with an API token. If you have a legacy integration that cannot be switched to token-based authentication, please [contact Support](https://www.bulksms.com/contact/) to request an exemption.
  - name: Message
    description: |
      A message record represents an SMS that has been sent or received.

      To send messages, create a `SubmissionEntry` and submit it to the Send Messages Operation.

      You can retrieve sent and received messages in a number of ways.

      ### Retrieving messages by status

      Messages are assigned a status as they progress through their lifecycle.  You can use the List Messages Operation to filter by various statuses.  For the status values used to filter, see the `status.type` and `status.subtype` values of the `Message` object.  You supply a value for the `filter` query parameter following this pattern `status.type==SENT`.  Since more than one messages are normally returned, you can also paginate the result using the `sortOrder` and `limit` query parameters.  Note that `limit` is not the only way to limit the number of records.  The result will also be limited by the `filter.submissionDate` property.  The default value for this property is `NOW() - 7 days`.

      Messages can also be retrieved by the webhook mechanism.  See the [webhooks page](/developer/webhooks/) for more information.

      ### Sending and receiving messages

      The examples shown in this section are for a single message submission.

      If you need to send a single text message to one or more recipients you will need to create a `SubmissionEntry` object and submit it to the Send Messages Operation.  For more advanced submission types, make use of the [Send Messages Operation](#tag/message/POST/messages) which supports batch sending (by submitting an array) and scheduling (via the `schedule-date` query parameter).

      The following fields can be set for a `SubmissionEntry`:
      - the `to` field is required and contains the phone number or group details
      - the `body` field is required and contains the message content
      - other fields like `from`, `routingGroup`, `encoding`, etc. are optional

      ### Body Templates

      When sending a message you can use template fields to customise the message text.

      *Field based templates* allow you to create a message with place-holders for custom fields.  Fields are identified by a zero based index; the first field is `F0`, the second is `F1` and so on.

      For example, if you want to send a message "Welcome Jack, you owe $200.00", supply the body as `"Welcome {F0######}, you owe {F1######}"` and send `"fields": ["Jack", "$200.00"]` in the relevant `to` entry.  The `#` characters specify the maximum length of the field.

      If you are sending to contacts in your phonebook, you can use *Phonebook based templates*.  The template for the contact's first name is `{fn######}` and the surname is `{sn######}`.

      See the [Send Messages Operation](#tag/message/POST/messages) for detailed examples.
  - name: Profile
    description: |
      Operations related to the profile of the user
  - name: Webhooks
    description: |
      Manage webhooks that notify your server when messages are sent or received.

      For full details on implementing your webhook — including event types, request headers, payload structure, retry logic, and testing — see the [Webhook Developer Guide](/developer/webhooks/).
  - name: Credits
    description: |
      Credit management operations
  - name: Blocked Numbers
    description: |
      Blocked number management operations
  - name: Attachments
    description: |
      Operations related to SMS attachments

security:
  - basicAuth: []

paths:
  /messages:
    get:
      tags: [Message]
      operationId: message.list
      summary: Retrieve Messages
      description: |
        Retrieve the messages you have sent or received.

        Scheduled messages are available for retrieval only after the delivery date.

        All the parameters are optional.  If a value is not supplied for `filter`, the messages are not filtered.

        Messages can be filtered by supplying query clauses in the `filter` parameter. Each clause has the form `name=value` where `name` is the name of a filter field and `value` is a valid value for that field.  A value for a field is optional. Include a clause for a field in the filter only when there is a need to fetch messages that match some value for that field.
        For a numeric filter field, you can also use the less than operator (`<`).

        If present, the filter value must have at least one clause, but it can contain a combination of clauses. Multiple clauses are separated with the `&` symbol.  Semantically, multiple clauses form a [logical conjunction](https://en.wikipedia.org/wiki/Logical_conjunction).

        For example, if you want to list all messages that were sent as part of a particular submission, your filter contains two clauses and will look something like this
        ```
        type%3DSENT&submission.id%3D1-00000000000522347562
        ```
        Because `filter` is a request parameter, it is important to note that the value for this parameter must be *URL encoded*. In particular, the `=` encodes to `%3D` and the `&` encodes to `%26`.  Note that you do not have to encode the `<` character.

        Using the previous example to illustrate; after encoding and encasing it, the clauses are transformed into a request that looks like this
        ```
        GET /v1/messages?filter=type%3DSENT%26submission.id%3D1-00000000000522347562
        ```
        If the field name or the field value of a clause is not valid, a [bad_request error](errors#bad-request) is returned instead of the usual result.  The `detail` field of this error provides more information about the problem.

        The table below lists the fields available for filtering

        | Field | Type   | Values | Note and example |
        |-------|------|--------------------|------|
        | id            | Integer  | Positive integer  | Use the `id` field with `<` (or with `>`) to fetch messages that are older (or newer) than those that are already fetched. `filter=id<123456` |
        | type          | String  | SENT, RECEIVED  | SENT are Mobile Terminating (MT) SMSs; RECEIVED are Mobile Originating (MO) SMSs. `filter=type%3DSENT` |
        | submission.id | String  |  | `filter=submission.id%3D1-00000000000522347562` |
        | status.type   | String  | ACCEPTED, SENT, DELIVERED, FAILED  | See the message `status.type` field for more information. `filter=status.type%3DDELIVERED` |
        | status.id| String  |  | See the message `status.id` field for more information. `filter=status.id%3DFAILED.EXPIRED`|
        | submission.date | String | Formatted Date | A fully specified date (e.g. 2017-01-01T10:00:00+01:00).  Use this field with `<=`, `<`, `>` or `>=` to limit the values. `filter=submission.date%3E%3D2017-01-01T10%3A00%3A00%2B01%3A00` |
        | userSuppliedId  | String | | Use a string value you specified in the `userSuppliedId` property when you sent the message. Only `SENT` messages will be retrieved. `filter=userSuppliedId%3Dacc009876` |
      parameters:
        - in: query
          name: filter
          description: See the message filtering for more information.
          schema:
            type: string
        - in: query
          name: sortOrder
          description: |
            The default value is DESCENDING

            If the `sortOrder` is DESCENDING, the newest messages be first in the result.
            ASCENDING sort is useful if you want to pull messages in the order in which they were created.
          schema:
            type: string
            enum:
              - ASCENDING
              - DESCENDING
        - in: query
          name: limit
          description: |
            The maximum number of messages that are returned.  The default is 1000.

            The value of `limit` is not a guarantee that a specific number of messages will be in the response, even if there are more messages available.  Consider the case where you have 150 messages and you specify `limit=50`.  It is possible that only 49 messages will be returned.  The  way to make sure that there are no more messages is to submit a new call using the `id` filter field with the `<` operator (described above).
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Contains the requested array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
              example:
                - id: "12345"
                  type: SENT
                  from: "+447911123456"
                  to: "+447700900000"
                  body: "Hi there!"
                  encoding: TEXT
                  protocolId: 0
                  messageClass: 1
                  numberOfParts: 1
                  creditCost: 1.0
                  submission:
                    id: "submission-98765"
                    date: "2026-04-02T15:51:37.623Z"
                  status:
                    id: "DELIVERED.null"
                    type: DELIVERED
                    subtype: null
                  relatedSentMessageId: null
                  userSuppliedId: null
        '400':
          $ref: '#/components/responses/bad-request'
      x-codeSamples:
        - lang: C#
          label: C# Complete Example
          source: |
            using System;
            using System.Net.Http;
            using System.Net.Http.Headers;
            using System.Text;
            using System.Threading.Tasks;

            class Program
            {
                static async Task Main()
                {
                    var tokenId = "your_token_id";
                    var tokenSecret = "your_token_secret";

                    using var client = new HttpClient();
                    var auth = Convert.ToBase64String(Encoding.UTF8.GetBytes($"{tokenId}:{tokenSecret}"));
                    client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Basic", auth);

                    // Filter to get only SENT messages
                    var response = await client.GetAsync("https://api.bulksms.com/v1/messages?filter=type%3DSENT");
                    var body = await response.Content.ReadAsStringAsync();

                    if (response.IsSuccessStatusCode)
                        Console.WriteLine(body);
                    else
                        Console.WriteLine($"Error {(int)response.StatusCode}: {body}");
                }
            }
    post:
      tags: [Message]
      operationId: message.send
      summary: Send Messages
      description: |
        Send messages to one or more recipients.

        You can post up to `50,000` messages in a batch.
        But note that the `deduplication-id` is set per submission, so it is recommended that you use a smaller number, like `4000` per submission in order to make resubmissions on network failures more practical.

        #### Repliability

        When a sent message is _repliable_,  the BulkSMS system can process an SMS response sent by your recipient.

        The message sent by your customer is called a mobile originating (MO) message and would be available under `RECEIVED` messages.
        You can obtain a list of MOs using the [retrieve messages API call](#tag/message/GET/messages).
        In addition you can also get a list of the MOs that are associated with a specific sent message (see the [list related messages API call](#tag/message/GET/messages/{id}/relatedReceivedMessages)).

        If you use a specific _sender id_ in the `from` property of the send message, the message will not be repliable.
        If you want a message to be repliable, you need to specify `REPLIABLE` in the `from.type` property.

        If you do not set the `from` property, your account settings are considered to determine whether or not the message is repliable.
        If the _default repliable_ setting on your account is _yes_ then the message will be repliable.
        If this setting is _no_, the message will not be repliable.


        #### Body templates

        When sending a message you can use template fields to customise the message text.

        *Field based templates* allow you to create a message with place-holders for custom fields.  Fields are identified by a zero based index; the first field is `F0`, the second is `F1` and so on.

        For example, let's say you want to send a daily SMS message to all your clients that tell them what their current balance is.  The `body` of the message could look something like this

        ```
        Good morning {F0######}, your balance is {F1######}
        ```

        In this message, the first field, `F0`, is the name  of the customer and the second field `F1` is the balance for that customer.  The `#` used to specify the maximum length  of the field.  Note that the maximum length allowed for the value includes the space taken by the braces, template name and hash symbol.  For example, the value `{F0#}` specifies a maximum length of `5`.  If the data is longer than this length, the data will be truncated when the message body is constructed.

        The data fields are provided in the property named `fields` in the `to` element.  Here is a complete example of how this might look

        ```
        {
          "body": "Good morning {F0######}, your balance is {F1######}",
          "to":  [
              {"address": "27456789","fields": ["Harry", "$1345.23"] },
              {"address": "27456785","fields": ["Sally", "$2345.58"] }
          ]
        }
        ```

        If you are sending to contacts (or to groups) in your phonebook, you can use the *Phonebook based templates*.  These are similar to the templates described above, but they have specific names. The template for the contact's first name is identified by `fn` and the template for the contact's surname is identified by `sn`.  Below is an example that will work if the numbers are registered in your phonebook.

        ```
        {
          "body": "Hi {fn######} {sn######}, have a great day!",
          "to":  [
              {"address": "27456789" },
              {"address": "27456785" }
          ]
        }
        ```
      parameters:
        - in: query
          name: auto-unicode
          default: false
          description: |
            Specifies how to deal with message text that contains characters not present in the GSM 03.38 character set.

            Messages that contain only GSM 03.38 characters are not affected by this setting.
            If the value is `true` then a message containing non-GSM 03.38 characters will be transmitted as a Unicode SMS (which is most likely more costly).

            Please note: when `auto-unicode` is `true` and the value of the `encoding` property is specified as `UNICODE`, the message will always be sent as `UNICODE`.

            If the value is `false` and the `encoding` property is `TEXT` then non-GSM 03.38 characters will be replaced by the `?` character.

            When using this setting on the API, you should take care to ensure that your message is _clean_.

            Invisible unicode and unexpected characters could unintentionally convert a message to `UNICODE`.  A common mistake is to use the backtick character (\`) which is unicode and will turn your `TEXT` message into a `UNICODE` message.
          schema:
            type: boolean
        - in: query
          name: schedule-date
          description: |
            Allows you to send a message in the future.

            An example value is `2019-02-18T13:00:00+02:00`.  It encodes to `2019-02-18T13%3A00%3A00%2B02%3A00`.
            Credits are deducted from your account immediately. Once submitted, scheduled messages cannot be changed or cancelled.
            The date can be a maximum of two years in the future. If the value is in the past, the message will be sent immediately.
            The date format requires you to supply an offset from UTC. You can decide to use the offset of your timezone, or maybe the zone of the recipient's location is more appropriate.
            If the destination is a group, the group members are determined at the time that you submit the message; not the time the message is scheduled to be sent.
          schema:
            type: string
            format: date-time
        - in: query
          name: schedule-description
          description: |
            A note that is stored together with a scheduled submission, which could be used to more easily identify the scheduled submission at a later date.

            The value of this field is ignored if the `schedule-date` is not provided.
            A value that is longer than 256 characters is truncated.
          schema:
            type: string
        - in: query
          name: deduplication-id
          description: |
            Safeguards against the possibility of sending the same messages more than once.

            If a communication failure occurs during a submission, you cannot be sure that the submission was processed; therefore you would have to submit it again. When you post the retry, you must use the `deduplication-id` of the original post. The BulkSMS system uses this ID to check that the request was not previously processed. (If it was previously processed, the submission will succeed, and the behaviour will be indistinguishable to you from a non-duplicated submission). The ID expires after about 12 hours.
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        description: The messages to send.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SubmissionEntry'
                - type: array
                  items:
                    $ref: '#/components/schemas/SubmissionEntry'
            example:
              to: "+447700900000"
              body: "Hi there!"
      responses:
        '201':
          description: An array of Message objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
              example:
                - id: "12345"
                  type: SENT
                  from: "+447911123456"
                  to: "+447700900000"
                  body: "Hi there!"
                  encoding: TEXT
                  protocolId: 0
                  messageClass: 1
                  numberOfParts: 1
                  creditCost: 1.0
                  submission:
                    id: "submission-98765"
                    date: "2026-04-02T15:51:37.623Z"
                  status:
                    id: "ACCEPTED.null"
                    type: ACCEPTED
                    subtype: null
                  relatedSentMessageId: null
                  userSuppliedId: null
        '400':
          $ref: '#/components/responses/bad-request'
        '403':
          $ref: '#/components/responses/credits'
      x-codeSamples:
        - lang: PHP
          label: PHP Complete Example
          source: |
            <?php
            // Requires cURL extension (included in most PHP installations).
            // To run under docker:
            // docker run -v $PWD:/code php:8.3-alpine php /code/send.php

            $tokenId = 'your_token_id';
            $tokenSecret = 'your_token_secret';
            $messages = [
                ['to' => '+447700900000', 'body' => 'Hello World!'],
                ['to' => '+447700900001', 'body' => 'Hello World!'],
            ];

            $ch = curl_init('https://api.bulksms.com/v1/messages?auto-unicode=true');
            curl_setopt_array($ch, [
                CURLOPT_POST           => true,
                CURLOPT_RETURNTRANSFER => true,
                CURLOPT_TIMEOUT        => 20,
                CURLOPT_CONNECTTIMEOUT => 10,
                CURLOPT_POSTFIELDS     => json_encode($messages),
                CURLOPT_HTTPHEADER     => [
                    'Content-Type: application/json',
                    'Authorization: Basic ' . base64_encode("$tokenId:$tokenSecret"),
                ],
            ]);

            $response = curl_exec($ch);
            $status = curl_getinfo($ch, CURLINFO_HTTP_CODE);
            $error = curl_error($ch);
            curl_close($ch);

            if ($status === 201) {
                echo "Response: $response\n";
            } else {
                echo "Error (HTTP $status): " . ($error ?: $response) . "\n";
            }
        - lang: C#
          label: C# Complete Example
          source: |
            using System;
            using System.Net.Http;
            using System.Net.Http.Headers;
            using System.Text;
            using System.Threading.Tasks;

            class Program
            {
                static async Task Main()
                {
                    var tokenId = "your_token_id";
                    var tokenSecret = "your_token_secret";
                    var json = """{"to": "1111111", "body": "Hello World!"}""";

                    using var client = new HttpClient();
                    var auth = Convert.ToBase64String(Encoding.UTF8.GetBytes($"{tokenId}:{tokenSecret}"));
                    client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Basic", auth);

                    var content = new StringContent(json, Encoding.UTF8, "application/json");
                    var response = await client.PostAsync("https://api.bulksms.com/v1/messages", content);
                    var body = await response.Content.ReadAsStringAsync();

                    if (response.IsSuccessStatusCode)
                        Console.WriteLine(body);
                    else
                        Console.WriteLine($"Error {(int)response.StatusCode}: {body}");
                }
            }
        - lang: Java
          label: Java Complete Example
          source: |
            import java.net.URI;
            import java.net.http.HttpClient;
            import java.net.http.HttpRequest;
            import java.net.http.HttpResponse;
            import java.util.Base64;

            public class SendMessage {
                public static void main(String[] args) throws Exception {
                    var tokenId = "your_token_id";
                    var tokenSecret = "your_token_secret";
                    var json = """
                        {"to": "1111111", "encoding": "UNICODE", "body": "Dobrá práce! Jak se máš?"}
                        """;

                    var auth = Base64.getEncoder().encodeToString((tokenId + ":" + tokenSecret).getBytes());

                    var request = HttpRequest.newBuilder()
                        .uri(URI.create("https://api.bulksms.com/v1/messages"))
                        .header("Content-Type", "application/json")
                        .header("Authorization", "Basic " + auth)
                        .POST(HttpRequest.BodyPublishers.ofString(json))
                        .build();

                    var response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());

                    System.out.println("Status: " + response.statusCode());
                    System.out.println(response.body());
                }
            }
        - lang: Node.js
          label: Node.js Complete Example
          source: |
            const tokenId = 'your_token_id';
            const tokenSecret = 'your_token_secret';

            const response = await fetch('https://api.bulksms.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Basic ' + btoa(tokenId + ':' + tokenSecret),
              },
              body: JSON.stringify({
                to: ['+447700900000', '+447700900001'],
                body: 'Hello World!',
              }),
            });

            const data = await response.json();
            console.log('Status:', response.status);
            console.log('Response:', JSON.stringify(data, null, 2));
        - lang: Python
          label: Python Complete Example
          source: |
            import requests

            token_id = "your_token_id"
            token_secret = "your_token_secret"

            response = requests.post(
                "https://api.bulksms.com/v1/messages",
                auth=(token_id, token_secret),
                json={
                    "to": ["1111111", "1111112"],
                    "body": "Hello World!",
                    "encoding": "UNICODE",
                },
            )

            if response.ok:
                print(response.json())
            else:
                print(f"Error {response.status_code}: {response.text}")

