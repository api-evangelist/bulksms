  /rmm/pre-sign-attachment:
    post:
      tags: [Attachments]
      operationId: attachment.presign
      summary: Upload an attachment via a signed URL
      description: |
        When composing an SMS, you can add SMS attachments by adding a URL to your text. When the recipient clicks on the URL, the attached file will be downloaded and opened on their mobile device.

        The best way to do this is to store the file on a web server you own and use that URL in the SMS text. This URL will be easily recognisable to your message recipient and ties your message back to your brand or company.

        If that's not possible, you can use BulkSMS storage to keep the files that you want to attach to your SMS. These files will be deleted after 30 days as per our fair use policy.

        We recommend you keep this file size below 20 MB, as larger files may be deleted without warning.

        To use the BulkSMS storage, follow these three steps:

        **Step 1**: Use your API Token to request a pre-signed URL.  This is what this `pre-sign-attachment` method is for.  It returns a PreSignInfo object that you will use in the other two steps.

        **Step 2**: Upload the file using a standard HTTP `PUT` request. For your `PUT` request, use the value of `putURL` from the PreSignInfo object as the request address.  You also have to add the entries from the `fields` property (of the PreSignInfo object) to the headers of your 'PUT' request. You send the file content as the body of the `PUT` request.

        **Step 3**: Now you can use the value of `fetchURL` from the PreSignInfo object in the body of your SMS messages and send those using the usual messaging API (described elsewhere in this document).  If you send the same file to many recipients, it is safe to use the same URL for all of them.

        If you need to, take a closer look at the example program (on the right-hand side) to get a better idea of how to implement this process.
      requestBody:
        required: true
        description: Describes the file to upload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreSignRequest'
      responses:
        '200':
          description: A PreSignInfo object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreSignInfo'
      x-codeSamples:
        - lang: C#
          label: C# Complete Example
          source: |
            using System;
            using System.IO;
            using System.Net.Http;
            using System.Net.Http.Headers;
            using System.Text;
            using System.Text.Json;
            using System.Threading.Tasks;

            class Program
            {
                const string TokenId = "your-token-id";
                const string TokenSecret = "your-token-secret";
                const string PhoneNumber = "1111111";
                const string FilePath = "path/to/file.pdf";

                static readonly HttpClient Client = new();

                static async Task Main()
                {
                    var auth = Convert.ToBase64String(Encoding.UTF8.GetBytes($"{TokenId}:{TokenSecret}"));
                    Client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Basic", auth);

                    // Step 1: Get a pre-signed upload URL
                    var signJson = """{"fileExtension": "pdf", "mediaType": "application/pdf"}""";
                    var signResponse = await Client.PostAsync(
                        "https://api.bulksms.com/v1/rmm/pre-sign-attachment",
                        new StringContent(signJson, Encoding.UTF8, "application/json"));
                    var signInfo = JsonSerializer.Deserialize<PreSignInfo>(await signResponse.Content.ReadAsStringAsync());

                    // Step 2: Upload the file to the signed URL
                    var uploadRequest = new HttpRequestMessage(HttpMethod.Put, signInfo.putUrl);
                    uploadRequest.Content = new StreamContent(File.OpenRead(FilePath));
                    foreach (var field in signInfo.fields)
                        uploadRequest.Content.Headers.TryAddWithoutValidation(field.name, field.value);
                    await Client.SendAsync(uploadRequest);

                    // Step 3: Send a message with the attachment URL
                    var msgJson = $"""{{ "to": "{PhoneNumber}", "body": "See attachment: {signInfo.fetchUrl}" }}""";
                    var msgResponse = await Client.PostAsync(
                        "https://api.bulksms.com/v1/messages?auto-unicode=true",
                        new StringContent(msgJson, Encoding.UTF8, "application/json"));

                    Console.WriteLine(await msgResponse.Content.ReadAsStringAsync());
                }

                record PreSignInfo(string putUrl, string fetchUrl, Field[] fields);
                record Field(string name, string value);
            }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        The API uses HTTP Basic Auth with an **API Token** for authentication.

        API tokens can be created by logging into your account and visiting _Settings > Developer Settings > API Tokens_.

        Supply the token ID as the username and the token secret as the password. The values must be [Base64 encoded](https://en.wikipedia.org/wiki/Base64) before using them in the `Authorization` header.

        For example, if the token ID is `BBDE1B476E03498AA768F66A286AABDC-01-B` and the token secret is `9jSbVDK20!MXdfRGiIIFu#ffUE8*S`, the unencoded header value is `BBDE1B476E03498AA768F66A286AABDC-01-B:9jSbVDK20!MXdfRGiIIFu#ffUE8*S`.  After encoding, the full header becomes

        ```
        Authorization: Basic QkJERTFCNDc2RTAzNDk4QUE3NjhGNjZBMjg2QUFCREMtMDEtQjo5alNiVkRLMjAhTVhkZlJHaUlJRnUjZmZVRTgqUw==
        ```

        You are requested to preemptively provide the `Authorization` header in your requests and not wait until the server has provided a `401 Unauthorized` response. Doing so will reduce the number of requests required to achieve your goal, which will improve overall performance.

        > **Username and password authentication is no longer supported.** Accounts created after 2026-04-29 can only authenticate with an API token. If you have a legacy integration that cannot be switched to token-based authentication, please [contact Support](https://www.bulksms.com/contact/) to request an exemption.

  schemas:
    PreSignRequest:
      type: object
      properties:
        fileExtension:
          type: string
          description: The extension of the file.  Usually related to the media type.
          example: pdf
        mediaType:
          type: string
          description: The media type of the file you would like to upload.  If you are not sure what value to use here, check out the standard [list of media types](https://www.iana.org/assignments/media-types/media-types.xhtml).
          example: application/pdf

    PreSignInfo:
      type: object
      properties:
        putUrl:
          type: string
          description: The address of the PUT request to upload the file.
          example: https://some.place/aethzd.pdf?Token=IQoJb3JpZ2luX2EP3
        fetchUrl:
          type: string
          description: The URL you use in your SMS text.  It is the file location.
          example: "https://smsattach.it/bedhkd.pdf"
        fields:
          type: array
          description: Name value objects to add to the headers of the PUT request.
          items:
            type: object
            properties:
              name:
                type: string
                description: The header name
                example: x-amz-acl
              value:
                type: string
                description: The header value
                example: public-read

    Profile:
      type: object
      required:
        - id
        - username
        - created
        - credits
        - quota
      properties:
        id:
          type: string
        username:
          type: string
        created:
          type: string
          format: date-time
        credits:
          type: object
          properties:
            balance:
              type: number
              format: float
            limit:
              type: integer
              format: int32
            isTransferAllowed:
              type: boolean
        quota:
          type: object
          required:
            - size
            - remaining
          properties:
            size:
              description: The setting that limits the number of messages you can send in a day.
              type: integer
              format: int32
            remaining:
              description: The number of messages you can still send today.
              type: integer
              format: int32
        originAddresses:
          type: object
          properties:
            isFullControlAllowed:
              type: boolean
            allowed:
              type: array
              items:
                type: string
        company:
          type: object
          properties:
            name:
              type: string
            taxReference:
              type: string
        commerce:
          type: object
          properties:
            bankPaymentReference:
              type: string
            address:
              type: object
              properties:
                street:
                  type: array
                  items:
                    type: string
                city:
                  type: string
                region:
                  type: string
                country:
                  type: string
                postalCode:
                  type: string

    SubmissionEntry:
      description: An object that you use when posting messages.
      type: object
      required:
        - to
        - body
      properties:
        from:
          description: |
            Identifies the sender.

            You can supply either a string value or a structured object.
            If you supply a string, the `type` of the sender is derived to be either INTERNATIONAL or ALPHANUMERIC.  If the value does not begin with a `+` and it contains at least one character that is not a digit, the type is detected as ALPHANUMERIC. Otherwise, the type is detected as INTERNATIONAL.
          oneOf:
            - type: string
              description: |
                A string sender ID (international number or alphanumeric).
                You can also supply a structured object with explicit `type` and `address` fields — use the selector above to see that format.
                If you supply a string, the `type` is derived to be either INTERNATIONAL or ALPHANUMERIC based on the value.
              example: "+447911123456"
            - type: object
              required:
                - type
              properties:
                type:
                  description: |
                    The type of the sender id.

                    If you want BulkSMS to collect replies to this message on your behalf, specify the type as REPLIABLE.  If the recipient is in a country where BulkSMS does not have a local reply number, the reply may incur costs that are more expensive than sending a local SMS in that country.
                    If you operate a service from a shortcode in a locale that allows messaging from such a shortcode, you can specify SHORTCODE for the type.
                  type: string
                  enum:
                    - INTERNATIONAL
                    - ALPHANUMERIC
                    - SHORTCODE
                    - REPLIABLE
                address:
                  type: string
                  example: "1111111"
                  description: |
                    The address of the sender id.

                    The validation for this field depends on the value of the `type`.
                    INTERNATIONAL can start with `+`. It has a maximum length of 15 digits, and has to be longer than 6 digits.
                    ALPHANUMERIC has a maximum length of 11 characters.
                    SHORTCODE has a maximum length of 6 digits.
                    REPLIABLE should not specify a value here.
        to:
          description: |
            Identifies the recipients.

            You can supply a single string (phone number), an array of strings, a single [Recipient](#model/Recipient) object, or an array of Recipient objects.
            If you supply a string, the `type` is taken as INTERNATIONAL.
          oneOf:
            - type: string
              description: |
                A single phone number.
                You can also supply an array of strings, a single [Recipient](#model/Recipient) object, or an array of Recipient objects — use the selector above to see each format.
                If you supply a string, the `type` is taken as INTERNATIONAL.
              example: "+447700900000"
            - type: array
              description: An array of phone numbers
              items:
                type: string
              example: ["+447700900000", "+447700900001"]
            - $ref: '#/components/schemas/Recipient'
            - type: array
              description: An array of recipient objects
              items:
                $ref: '#/components/schemas/Recipient'
        routingGroup:
          description: |
            Allows you to choose routing. The default is STANDARD.
          type: string
          enum:
            - STANDARD
            - ECONOMY
            - PREMIUM

        encoding:
          description: |
            Describes the content of the message body.

            Typically this is TEXT, which is the default if no value is provided.

            If you need to send characters that are not covered by the [GSM 03.38](https://en.wikipedia.org/wiki/GSM_03.38) character set you will need to specify UNICODE.

            If you want to send a sequence of bytes, you must use BINARY.

            You can also or use the `auto-unicode` parameter of the Send Messages Operation.

            If you supply the value of `TEXT` while `auto-unicode` is `true` then your message may be converted to `UNICODE`.

            If you supply a value other than `TEXT` for this property while `auto-unicode` is `true` then no automatic conversion will take place.

          type: string
          enum:
            - TEXT
            - UNICODE
            - BINARY

        longMessageMaxParts:
          description: |
            The maximum number of message parts that can be used for a [concatenated message](https://en.wikipedia.org/wiki/Concatenated_SMS).
            The default is `3`.
          type: integer
          format: int32
          example: 5
        body:
          description: |
            The message content as described in the `encoding`. If the `encoding` is BINARY, the body must contain only hexadecimal digits where one byte is represented as two digits. For example, if you want to send two bytes '0x05' and '0x1F', the message body must contain the text '051F'.

            The message content can also contain templates, read the [body templates section](#tag/message) for more information.
          type: string
          example: Hi there!
        userSuppliedId:
          description: |
            Correlate the messages created from this submission to your data.

            The value can contain no more than 20 characters.
          type: string
          example: submission-12765
        protocolId:
          description: |
            The TP-PID value from GSM 03.40[.750] §9.2.3.9.

            You can provide either an integer value, or a mnemonic string.

            If unspecified, this property defaults to `0`, representing the IMPLICIT value.
            Numeric values are listed below
            | Name | Value|
            |----- |------|
            | IMPLICIT              | 00 |
            | SHORT_MESSAGE_TYPE_0  | 64 |
            | REPLACE_MESSAGE_1     | 65 |
            | REPLACE_MESSAGE_2     | 66 |
            | REPLACE_MESSAGE_3     | 67 |
            | REPLACE_MESSAGE_4     | 68 |
            | REPLACE_MESSAGE_5     | 69 |
            | REPLACE_MESSAGE_6     | 70 |
            | REPLACE_MESSAGE_7     | 71 |
            | RETURN_CALL           | 95 |
            | ME_DOWNLOAD           | 125 |
            | ME_DEPERSONALIZE      | 126 |
            | SIM_DOWNLOAD          | 127 |
          type: string
          enum:
            - IMPLICIT
            - SHORT_MESSAGE_TYPE_0
            - REPLACE_MESSAGE_1
            - REPLACE_MESSAGE_2
            - REPLACE_MESSAGE_3
            - REPLACE_MESSAGE_4
            - REPLACE_MESSAGE_5
            - REPLACE_MESSAGE_6
            - REPLACE_MESSAGE_7
            - RETURN_CALL
            - ME_DOWNLOAD
            - ME_DEPERSONALIZE
            - SIM_DOWNLOAD
        messageClass:
          description: |
            The class of the message, as specified by §4 of the GSM 03.38 specification.

            You can provide either an integer value, or a mnemonic string.

            The default value is SIM_SPECIFIC.
            Numeric values are
            | Name | Value|
            |------|------|
            | FLASH_SMS | 0      |
            | ME_SPECIFIC | 1    |
            | SIM_SPECIFIC | 2   |
            | TE_SPECIFIC | 3   |
          type: string
          enum:
            - FLASH_SMS
            - ME_SPECIFIC
            - SIM_SPECIFIC
            - TE_SPECIFIC
        deliveryReports:
          description: |
            The type of delivery reports to request from the delivering network.

            The default value  is `ALL`.
            Please note that not all networks support delivery reports.

            ALL. All possible delivery reports

            ERRORS. Only error delivery reports

            NONE. No delivery reports
          type: string
          enum:
            - ALL
            - ERRORS
            - NONE

    Recipient:
      type: object
      description: A structured recipient object
      properties:
        type:
          description: Type of the recipient. The default value is INTERNATIONAL.
          type: string
          enum:
            - INTERNATIONAL
            - GROUP
        address:
          description: The phone number of the recipient.  It must be supplied if the `type` is INTERNATIONAL
          type: string
        name:
          description: The name of a group in your phonebook. A value can be given if the `type` is GROUP.
          type: string
        id:
          description: The id of a group in your phonebook.  A value can be given if the `type` is GROUP.
          type: string
        fields:
          type: array
          description: |
            Custom fields that can be used in the message body. A value can be given if the `type` is INTERNATIONAL

            Read the [body templates section](#tag/message) for more information.
          items:
            type: string
      example:
        type: INTERNATIONAL
        address: "1111111"
        fields: ["Jack", "$200.00"]

    TransferEntry:
      type: object
      required:
        - toUsername
        - toUserId
        - credits
      properties:
        toUsername:
          type: string
          example: roboto
          description: |
            The username of the account that will receive the credits.
        toUserId:
          type: number
          example: 2345
          description: |
            The numeric user ID of the account that will receive the credits.
            The ID must match the username.
        credits:
          type: number
          example: 2345
          description: |
            The amount of credits to transfer.
        commentOnFrom:
          type: string
          example: Transfer to Bobby
          description: |
            An optional note that will be shown on the credit history of your account.
            The maximum length of the comment is 100.
        commentOnTo:
          type: string
          example: Transfer from Danny
          description: |
            An optional note that will be shown on the credit history of the recipient's account.
            The maximum length of the comment is 100.

    WebhookEntry:
      type: object
      required:
        - name
        - url
        - triggerScope
      properties:
        name:
          type: string
          example: My MT Webhook
          description: |
            A text identifier for the webhook.
            More than one webhook cannot have the same name.
        url:
          type: string
          example: https://www.example.com
          description: |
            The location of the webhook.

            In addition to being a [valid URI](https://en.wikipedia.org/wiki/Uniform_Resource_Identifier#Syntax), the url must also start with `http` or `https`.
        contactEmailAddress:
          type: string
          example: tech_team@example.com
          description: |
            The email address to which emails will be sent if there are problem with invoking the webhook.

            The value must be a valid email address.
            If this value is `null`, no email will be sent.

            It is `null` by default.
        triggerScope:
          type: string
          enum:
            - SENT
            - RECEIVED
          description: |
            Specifies when the webhook will be triggered.

            Please note the values are case sensitive.

            If the value is `SENT`, the webhook will be called when a status update becomes available for a message you sent (i.e. a mobile terminating (MT) message).

            If the value is `RECEIVED`, the webhook will be called when a message is received (i.e. a mobile originating (MO) message).

            Note that this field forces you to create two separate webhook entries if you want to collect all messages.  However,  you can use the same `url` for both webhooks if you want.
          example: SENT
        invokeOption:
          type: string
          enum:
            - ONE
            - MANY
          description: |
            Specifies how to invoke your webhook.

            If the value is `ONE` the array POSTed to your webhook will contain no more than a single message.  Use this option if your webhook logic is unable to handle more than one messages at a time.

            If the value is `MANY` the array POSTed to your webhook can contain up to 10 messages.  This is the recommended option.  The number of calls made to your webhook would be less and this will speed up your total processing time.
            If your webhook fails for an invoke that has more than one message, each message in the array will automatically be retried one at a time.

            This value defaults to `ONE` - but it is recommended that you set this property to `MANY`.
          example: MANY
        active:
          type: boolean
          description: |
            Indicates whether you want the webhook activated.

            If the value is `true`, the webhook at the given `url` will be invoked with an empty array (`[]`) as part of the validation process.
            If the webhook responds with a `2xx` status code, the submission is accepted; if not the webhook is not created (or updated).

            If the value is `false` the webhook will be inactive, and it will not be invoked when messages are `SENT` or `RECEIVED`.

            The default value is `true`.
          example: true
        onWebApp:
          type: boolean
          example: true
          description: |
            Indicates whether you want to show this webhook on the Web App.

            Webhooks shown there can be updated by the user that use the public Web site.

            The default value is `true`.

    Webhook:
      type: object
      properties:
        id:
          type: number
          example: 234
        name:
          type: string
          example: My MT Webhook
        url:
          type: string
          example: https://www.example.com
        contactEmailAddress:
          type: string
          example: tech_team@example.com
        triggerScope:
          type: string
          example: SENT
        active:
          type: boolean
          example: true
        onWebApp:
          type: boolean
          example: true

    Message:
      type: object
      required:
        - id
        - type
        - to
        - body
        - status
      properties:
        id:
          description: A unique identifier that is assigned when the message is created.
          type: string
          example: "12345"
        type:
          description: The message direction
          type: string
          enum:
            - SENT
            - RECEIVED
        from:
          description: The address part of the sender id
          type: string
          example: "+447911123456"
        to:
          description: The phone number of the recipient
          type: string
          example: "+447700900000"
        body:
          description: The content of the message
          type: string
          example: "Hi there!"
        encoding:
          description: The type of the content.  See the `encoding` field for more information.
          type: string
          enum:
            - TEXT
            - UNICODE
            - BINARY
        protocolId:
          description: See the `protocolId` field for more information.
          type: integer
          format: int32
        messageClass:
          description: See the `messageClass` field for more information.
          type: integer
          format: int32
        numberOfParts:
          description: The number of parts.  If this is a concatenated message, the number of parts will be more than 1.  Note that this field does not have a value in the submission response.
          type: integer
          format: int32
        creditCost:
          description: The cost of the message (in credits).   Note that this field does not have a value in the submission response.
          type: number
          format: float
        submission:
          description: |
            Identifies the submission.
          type: object
          required:
            - id
            - date
          properties:
            id:
              description: A unique identity shared by all messages that were created from the same submission. This field should be ignored if the `type` is not SENT.
              type: string
              example: "submission-98765"
            date:
              description: The date and time the submission was processed. If the `type` is RECEIVED, this field reflects the date and time the received message was processed.
              type: string
              format: date-time
        status:
          description: The status of the message
          type: object
          required:
            - id
            - type
          properties:
            id:
              description: |
                A concatenated value A.B where A is the `status.type` and B is the `status.subtype`.
                It there is no value for `subtype` then B takes string value `"null"` (e.g. `"SENT.null"`).
              type: string
              example: "ACCEPTED.null"
            type:
              description: |

                ACCEPTED  Message accepted for delivery. Only returned for initial message submissions.

                SCHEDULED  Message accepted for delivery at a later date. Only returned for initial message  submissions.

                SENT  Message has been relayed away from our systems.

                DELIVERED  Successfully delivered to phone.

                UNKNOWN  Message is in an unknown state.

                FAILED  Delivery failed.
              type: string
              enum:
                - ACCEPTED
                - SCHEDULED
                - SENT
                - DELIVERED
                - UNKNOWN
                - FAILED
            subtype:
              description: |
                Has a value only if the `type` is FAILED.

                EXPIRED  Delivery failed because message expired before delivery was possible.

                HANDSET_ERROR  Delivery failed because of a problem related to the phone (e.g. message storage area full).

                BLOCKED  Your account has been blocked from sending to this phone (e.g. recipient replied STOP to block communication).

                NOT_SENT  Message delivery was not attempted: either we could not find a way to deliver the message (e.g. an invalid phone number), or delivery was blocked by fraud/abuse risk filtering. Please contact Support - you may need to have a setting enabled on your account to enable this messaging.
              type: string
              nullable: true
              enum:
                - EXPIRED
                - HANDSET_ERROR
                - BLOCKED
                - NOT_SENT
              example: null
        relatedSentMessageId:
          description: |
            This field has a value only if the type is RECEIVED.
            With SMS messages, it is not possible to link a reply directly with a specific sent message.  However, if you specified `REPLIABLE` in the `from` property, BulkSMS will link any reply to the most recent message sent to a given phone number.

            The `relatedSentMessageId` property keeps the information about this link.

            You can use this property to derive an implicit conversation from a set of messages.
              - If a received reply message has a `relatedSentMessageId`, you can use it to retrieve the last message that was sent before the reply was received.
              - If you have the `id` of the sent message and you want all the received messages that relate to it, you can use the List Related Messages Operation.
          type: string
          nullable: true
          example: null
        userSuppliedId:
          description: |
            This is the value you supplied in the `userSuppliedId` field.
            Has a value only if the `type` is SENT.
          type: string
          nullable: true
          example: null

    Error:
      description: See the errors page at https://www.bulksms.com/developer/json/v1/errors/ for more detail on what kind of errors you can get.
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          description: A URL to one of the error types listed at https://www.bulksms.com/developer/json/v1/errors/
          type: string
        title:
          description: A short description of the type
          type: string
        status:
          description: The HTTP status code
          type: integer
          format: int32
          example: 400
        detail:
          description: More information about why the error occurred.
          type: string

    PhoneNumber:
      type: string
      example: "44123456789"
      description: A phone number in E.164 format

    BlockedNumber:
      type: object
      required:
        - id
        - phoneNumber
      properties:
        id:
          type: number
          format: int32
          example: 234
          description: A unique identifier that is assigned when the BlockedNumber is created.
        phoneNumber:
          allOf:
            - $ref: '#/components/schemas/PhoneNumber'
        created:
          type: string
          format: date-time
          description: The date-time when the blocked number was created.
        description:
          type: string
          description: A note describing why the number is blocked.

  responses:
    bad-request:
      description: Bad Request. The content or structure of your submission, or a parameter, was found to be invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://developer.bulksms.com/json/v1/errors/#bad-request
            title: Bad Request
            status: 400
            detail: "Request body is not valid: ..."
    credits:
      description: Forbidden.  Inspect the body of the response for further details - for example, you may have insufficient credits remaining
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://developer.bulksms.com/json/v1/errors#insufficient-credits
            title: Insufficient Credits
            status: 403
    bad-webhook-url:
      description: The url given for the webhook is not callable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://developer.bulksms.com/json/v1/errors/#bad-request
            title: Bad Request
            status: 400
            detail: |
              Invoking the Webhook URL caused an error: 403 - Forbidden
    bad-webhook-id:
      description: A webhook with the given id does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://developer.bulksms.com/json/v1/errors/#not-found
            title: Not Found
            status: 404
            detail: |
              Webhook with id '1' does not exist
