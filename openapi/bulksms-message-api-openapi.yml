openapi: 3.2.0
info:
  title: BulkSMS JSON REST Message API
  version: 1.1.0
  x-logo:
    url: /developer/images/bulksms-logo-main.svg
    backgroundColor: '#FFFFFF'
  description: '## Overview


    The JSON REST API allows you to submit and receive BulkSMS messages.'
servers:
- url: https://api.bulksms.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Message
  description: A message record represents an SMS that has been sent or received.
paths:
  /messages:
    get:
      tags:
      - Message
      operationId: message.list
      summary: Retrieve Messages
      description: 'Retrieve the messages you have sent or received.


        Scheduled messages are available for retrieval only after the delivery date.


        All the parameters are optional. If a value is not supplied for `filter`, the messages are not filtered.


        Messages can be filtered by supplying query clauses in the `filter` parameter. Each clause has the form `name=value` where `name` is the name of a filter field and `value` is a valid value for that field. A value for a field is optional. Include a clause for a field in the filter only when there is a need to fetch messages that match some value for that field.

        For a numeric filter field, you can also use the less than operator (``) to fetch messages that are older (or newer) than those that are already fetched. `filter=id` or `>=` to limit the values. `filter=submission.date%3E%3D2017-01-01T10%3A00%3A00%2B01%3A00` |

        | userSuppliedId | String | | Use a string value you specified in the `userSuppliedId` property when you sent the message. Only `SENT` messages will be retrieved. `filter=userSuppliedId%3Dacc009876` |'
      parameters:
      - in: query
        name: filter
        description: See the message filtering for more information.
        schema:
          type: string
      - in: query
        name: sortOrder
        description: 'The default value is DESCENDING


          If the `sortOrder` is DESCENDING, the newest messages be first in the result.

          ASCENDING sort is useful if you want to pull messages in the order in which they were created.

          '
        schema:
          type: string
          enum:
          - ASCENDING
          - DESCENDING
      - in: query
        name: limit
        description: 'The maximum number of messages that are returned.  The default is 1000.


          The value of `limit` is not a guarantee that a specific number of messages will be in the response, even if there are more messages available.  Consider the case where you have 150 messages and you specify `limit=50`.  It is possible that only 49 messages will be returned.  The  way to make sure that there are no more messages is to submit a new call using the `id` filter field with the `<` operator (described above).

          '
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Contains the requested array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
              example:
              - id: '12345'
                type: SENT
                from: '+447911123456'
                to: '+447700900000'
                body: Hi there!
                encoding: TEXT
                protocolId: 0
                messageClass: 1
                numberOfParts: 1
                creditCost: 1.0
                submission:
                  id: submission-98765
                  date: '2026-04-02T15:51:37.623Z'
                status:
                  id: DELIVERED.null
                  type: DELIVERED
                  subtype: null
                relatedSentMessageId: null
                userSuppliedId: null
        '400':
          $ref: '#/components/responses/bad-request'
      x-codeSamples:
      - lang: C#
        label: C# Complete Example
        source: "using System;\nusing System.Net.Http;\nusing System.Net.Http.Headers;\nusing System.Text;\nusing System.Threading.Tasks;\n\nclass Program\n{\n    static async Task Main()\n    {\n        var tokenId = \"your_token_id\";\n        var tokenSecret = \"your_token_secret\";\n\n        using var client = new HttpClient();\n        var auth = Convert.ToBase64String(Encoding.UTF8.GetBytes($\"{tokenId}:{tokenSecret}\"));\n        client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue(\"Basic\", auth);\n\n        // Filter to get only SENT messages\n        var response = await client.GetAsync(\"https://api.bulksms.com/v1/messages?filter=type%3DSENT\");\n        var body = await response.Content.ReadAsStringAsync();\n\n        if (response.IsSuccessStatusCode)\n            Console.WriteLine(body);\n        else\n            Console.WriteLine($\"Error {(int)response.StatusCode}: {body}\");\n    }\n}\n"
    post:
      tags:
      - Message
      operationId: message.send
      summary: Send Messages
      description: 'Send messages to one or more recipients.


        You can post up to `50,000` messages in a batch.

        But note that the `deduplication-id` is set per submission, so it is recommended that you use a smaller number, like `4000` per submission in order to make resubmissions on network failures more practical.


        #### Repliability


        When a sent message is _repliable_, the BulkSMS system can process an SMS response sent by your recipient.


        The message sent by your customer is called a mobile originating (MO) message and would be available under `RECEIVED` messages.

        You can obtain a list of MOs using the retrieve messages API call.

        In addition you can also get a list of the MOs that are associated with a specific sent message (see the list related messages API call).


        If you use a specific _sender id_ in the `from` property of the send message, the message will not be repliable.

        If you want a message to be repliable, you need to specify `REPLIABLE` in the `from.type` property.


        If you do not set the `from` property, your account settings are considered to determine whether or not the message is repliable.

        If the _default repliable_ setting on your account is _yes_ then the message will be repliable.

        If this setting is _no_, the message will not be repliable.


        #### Body templates


        When sending a message you can use template fields to customise the message text.


        *Field based templates* allow you to create a message with place-holders for custom fields. Fields are identified by a zero based index; the first field is `F0`, the second is `F1` and so on.


        For example, let''s say you want to send a daily SMS message to all your clients that tell them what their current balance is. The `body` of the message could look something like this


        ```

        Good morning {F0######}, your balance is {F1######}

        ```


        In this message, the first field, `F0`, is the name of the customer and the second field `F1` is the balance for that customer. The `#` used to specify the maximum length of the field. Note that the maximum length allowed for the value includes the space taken by the braces, template name and hash symbol. For example, the value `{F0#}` specifies a maximum length of `5`. If the data is longer than this length, the data will be truncated when the message body is constructed.


        The data fields are provided in the property named `fields` in the `to` element. Here is a complete example of how this might look


        ```

        {

        "body": "Good morning {F0######}, your balance is {F1######}",

        "to": [

        {"address": "27456789","fields": ["Harry", "$1345.23"] },

        {"address": "27456785","fields": ["Sally", "$2345.58"] }

        ]

        }

        ```


        If you are sending to contacts (or to groups) in your phonebook, you can use the *Phonebook based templates*. These are similar to the templates described above, but they have specific names. The template for the contact''s first name is identified by `fn` and the template for the contact''s surname is identified by `sn`. Below is an example that will work if the numbers are registered in your phonebook.


        ```

        {

        "body": "Hi {fn######} {sn######}, have a great day!",

        "to": [

        {"address": "27456789" },

        {"address": "27456785" }

        ]

        }

        ```'
      parameters:
      - in: query
        name: auto-unicode
        default: false
        description: 'Specifies how to deal with message text that contains characters not present in the GSM 03.38 character set.


          Messages that contain only GSM 03.38 characters are not affected by this setting.

          If the value is `true` then a message containing non-GSM 03.38 characters will be transmitted as a Unicode SMS (which is most likely more costly).


          Please note: when `auto-unicode` is `true` and the value of the `encoding` property is specified as `UNICODE`, the message will always be sent as `UNICODE`.


          If the value is `false` and the `encoding` property is `TEXT` then non-GSM 03.38 characters will be replaced by the `?` character.


          When using this setting on the API, you should take care to ensure that your message is _clean_.


          Invisible unicode and unexpected characters could unintentionally convert a message to `UNICODE`.  A common mistake is to use the backtick character (\`) which is unicode and will turn your `TEXT` message into a `UNICODE` message.

          '
        schema:
          type: boolean
      - in: query
        name: schedule-date
        description: 'Allows you to send a message in the future.


          An example value is `2019-02-18T13:00:00+02:00`.  It encodes to `2019-02-18T13%3A00%3A00%2B02%3A00`.

          Credits are deducted from your account immediately. Once submitted, scheduled messages cannot be changed or cancelled.

          The date can be a maximum of two years in the future. If the value is in the past, the message will be sent immediately.

          The date format requires you to supply an offset from UTC. You can decide to use the offset of your timezone, or maybe the zone of the recipient''s location is more appropriate.

          If the destination is a group, the group members are determined at the time that you submit the message; not the time the message is scheduled to be sent.

          '
        schema:
          type: string
          format: date-time
      - in: query
        name: schedule-description
        description: 'A note that is stored together with a scheduled submission, which could be used to more easily identify the scheduled submission at a later date.


          The value of this field is ignored if the `schedule-date` is not provided.

          A value that is longer than 256 characters is truncated.

          '
        schema:
          type: string
      - in: query
        name: deduplication-id
        description: 'Safeguards against the possibility of sending the same messages more than once.


          If a communication failure occurs during a submission, you cannot be sure that the submission was processed; therefore you would have to submit it again. When you post the retry, you must use the `deduplication-id` of the original post. The BulkSMS system uses this ID to check that the request was not previously processed. (If it was previously processed, the submission will succeed, and the behaviour will be indistinguishable to you from a non-duplicated submission). The ID expires after about 12 hours.

          '
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        description: The messages to send.
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/SubmissionEntry'
              - type: array
                items:
                  $ref: '#/components/schemas/SubmissionEntry'
            example:
              to: '+447700900000'
              body: Hi there!
      responses:
        '201':
          description: An array of Message objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
              example:
              - id: '12345'
                type: SENT
                from: '+447911123456'
                to: '+447700900000'
                body: Hi there!
                encoding: TEXT
                protocolId: 0
                messageClass: 1
                numberOfParts: 1
                creditCost: 1.0
                submission:
                  id: submission-98765
                  date: '2026-04-02T15:51:37.623Z'
                status:
                  id: ACCEPTED.null
                  type: ACCEPTED
                  subtype: null
                relatedSentMessageId: null
                userSuppliedId: null
        '400':
          $ref: '#/components/responses/bad-request'
        '403':
          $ref: '#/components/responses/credits'
      x-codeSamples:
      - lang: PHP
        label: PHP Complete Example
        source: "<?php\n// Requires cURL extension (included in most PHP installations).\n// To run under docker:\n// docker run -v $PWD:/code php:8.3-alpine php /code/send.php\n\n$tokenId = 'your_token_id';\n$tokenSecret = 'your_token_secret';\n$messages = [\n    ['to' => '+447700900000', 'body' => 'Hello World!'],\n    ['to' => '+447700900001', 'body' => 'Hello World!'],\n];\n\n$ch = curl_init('https://api.bulksms.com/v1/messages?auto-unicode=true');\ncurl_setopt_array($ch, [\n    CURLOPT_POST           => true,\n    CURLOPT_RETURNTRANSFER => true,\n    CURLOPT_TIMEOUT        => 20,\n    CURLOPT_CONNECTTIMEOUT => 10,\n    CURLOPT_POSTFIELDS     => json_encode($messages),\n    CURLOPT_HTTPHEADER     => [\n        'Content-Type: application/json',\n        'Authorization: Basic ' . base64_encode(\"$tokenId:$tokenSecret\"),\n    ],\n]);\n\n$response = curl_exec($ch);\n$status = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n$error = curl_error($ch);\ncurl_close($ch);\n\nif ($status === 201) {\n    echo \"Response: $response\\n\";\n} else {\n    echo \"Error (HTTP $status): \" . ($error ?: $response) . \"\\n\";\n}\n"
      - lang: C#
        label: C# Complete Example
        source: "using System;\nusing System.Net.Http;\nusing System.Net.Http.Headers;\nusing System.Text;\nusing System.Threading.Tasks;\n\nclass Program\n{\n    static async Task Main()\n    {\n        var tokenId = \"your_token_id\";\n        var tokenSecret = \"your_token_secret\";\n        var json = \"\"\"{\"to\": \"1111111\", \"body\": \"Hello World!\"}\"\"\";\n\n        using var client = new HttpClient();\n        var auth = Convert.ToBase64String(Encoding.UTF8.GetBytes($\"{tokenId}:{tokenSecret}\"));\n        client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue(\"Basic\", auth);\n\n        var content = new StringContent(json, Encoding.UTF8, \"application/json\");\n        var response = await client.PostAsync(\"https://api.bulksms.com/v1/messages\", content);\n        var body = await response.Content.ReadAsStringAsync();\n\n        if (response.IsSuccessStatusCode)\n            Console.WriteLine(body);\n        else\n            Console.WriteLine($\"Error {(int)response.StatusCode}: {body}\");\n    }\n}\n"
      - lang: Java
        label: Java Complete Example
        source: "import java.net.URI;\nimport java.net.http.HttpClient;\nimport java.net.http.HttpRequest;\nimport java.net.http.HttpResponse;\nimport java.util.Base64;\n\npublic class SendMessage {\n    public static void main(String[] args) throws Exception {\n        var tokenId = \"your_token_id\";\n        var tokenSecret = \"your_token_secret\";\n        var json = \"\"\"\n            {\"to\": \"1111111\", \"encoding\": \"UNICODE\", \"body\": \"Dobrá práce! Jak se máš?\"}\n            \"\"\";\n\n        var auth = Base64.getEncoder().encodeToString((tokenId + \":\" + tokenSecret).getBytes());\n\n        var request = HttpRequest.newBuilder()\n            .uri(URI.create(\"https://api.bulksms.com/v1/messages\"))\n            .header(\"Content-Type\", \"application/json\")\n            .header(\"Authorization\", \"Basic \" + auth)\n            .POST(HttpRequest.BodyPublishers.ofString(json))\n            .build();\n\n        var response = HttpClient.newHttpClient().send(request, HttpResponse.BodyHandlers.ofString());\n\n        System.out.println(\"Status: \" + response.statusCode());\n        System.out.println(response.body());\n    }\n}\n"
      - lang: Node.js
        label: Node.js Complete Example
        source: "const tokenId = 'your_token_id';\nconst tokenSecret = 'your_token_secret';\n\nconst response = await fetch('https://api.bulksms.com/v1/messages', {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    'Authorization': 'Basic ' + btoa(tokenId + ':' + tokenSecret),\n  },\n  body: JSON.stringify({\n    to: ['+447700900000', '+447700900001'],\n    body: 'Hello World!',\n  }),\n});\n\nconst data = await response.json();\nconsole.log('Status:', response.status);\nconsole.log('Response:', JSON.stringify(data, null, 2));\n"
      - lang: Python
        label: Python Complete Example
        source: "import requests\n\ntoken_id = \"your_token_id\"\ntoken_secret = \"your_token_secret\"\n\nresponse = requests.post(\n    \"https://api.bulksms.com/v1/messages\",\n    auth=(token_id, token_secret),\n    json={\n        \"to\": [\"1111111\", \"1111112\"],\n        \"body\": \"Hello World!\",\n        \"encoding\": \"UNICODE\",\n    },\n)\n\nif response.ok:\n    print(response.json())\nelse:\n    print(f\"Error {response.status_code}: {response.text}\")\n"
  /messages/{id}:
    get:
      tags:
      - Message
      operationId: message.show
      summary: Show Message
      description: 'Get a message by its `id`.

        ```http

        GET /v1/messages/4023457654

        ```'
      parameters:
      - in: path
        name: id
        required: true
        description: The `id` of the message you want to retrieve
        schema:
          type: string
      responses:
        '200':
          description: The message detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: '12345'
                type: SENT
                from: '+447911123456'
                to: '+447700900000'
                body: Hi there!
                encoding: TEXT
                protocolId: 0
                messageClass: 1
                numberOfParts: 1
                creditCost: 1.0
                submission:
                  id: submission-98765
                  date: '2026-04-02T15:51:37.623Z'
                status:
                  id: DELIVERED.null
                  type: DELIVERED
                  subtype: null
                relatedSentMessageId: null
                userSuppliedId: null
        '404':
          description: The message cannot be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: https://developer.bulksms.com/json/v1/errors/#not-found
                title: Not Found
                status: 404
                detail: Message with id '123' does not exist
        '400':
          $ref: '#/components/responses/bad-request'
  /messages/{id}/relatedReceivedMessages:
    get:
      tags:
      - Message
      operationId: message.related.received
      summary: List Related Messages
      description: 'Get the messages related to a sent message identified by `id`.


        For more information on how this work, see the `relatedSentMessageId` field of the `Message` object.'
      parameters:
      - in: path
        name: id
        required: true
        description: The `id` of the sent message
        schema:
          type: string
      responses:
        '200':
          description: An array of related messages.  If a sent message with this `id` could not be found, or there are no related, received messages, the array will be empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
              example:
              - id: '67890'
                type: RECEIVED
                from: '+447700900000'
                to: '+447911123456'
                body: Thanks, got it!
                encoding: TEXT
                protocolId: 0
                messageClass: 1
                numberOfParts: 1
                creditCost: 0
                submission:
                  id: submission-98765
                  date: '2026-04-02T16:02:10.000Z'
                status:
                  id: DELIVERED.null
                  type: DELIVERED
                  subtype: null
                relatedSentMessageId: '12345'
                userSuppliedId: null
        '400':
          $ref: '#/components/responses/bad-request'
  /messages/send:
    get:
      tags:
      - Message
      operationId: message.send.simple.get
      summary: Send message by simple GET or POST
      description: 'A simple interface for sending a single message via GET.


        This is a convenience method, recommended for debugging or quick tests. It allows you to send a message from the browser address bar.


        For example:

        ```http

        GET /v1/messages/send?to=%2b270000000&body=Hello%20World

        ```


        You can also POST the same parameters as form-encoded fields to the Send Messages endpoint:

        ```http

        POST /v1/messages

        Content-Type: application/x-www-form-urlencoded


        to=%2b27000000000&body=Hello+World

        ```


        For production use, the Send Messages operation is recommended as it supports batch sending, templates, and scheduling.'
      parameters:
      - in: query
        name: to
        required: true
        description: The phone number of the recipient.
        schema:
          type: string
      - in: query
        name: body
        required: true
        description: The text you want to send.
        schema:
          type: string
      - in: query
        name: deduplication-id
        description: Refer to the `deduplication-id` parameter.
        schema:
          type: integer
          format: int32
      responses:
        '201':
          description: An array of Message objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
              example:
              - id: '12345'
                type: SENT
                from: '+447911123456'
                to: '+447700900000'
                body: Hi there!
                encoding: TEXT
                protocolId: 0
                messageClass: 1
                numberOfParts: 1
                creditCost: 1.0
                submission:
                  id: submission-98765
                  date: '2026-04-02T15:51:37.623Z'
                status:
                  id: ACCEPTED.null
                  type: ACCEPTED
                  subtype: null
                relatedSentMessageId: null
                userSuppliedId: null
        '400':
          $ref: '#/components/responses/bad-request'
        '403':
          $ref: '#/components/responses/credits'
components:
  responses:
    credits:
      description: Forbidden.  Inspect the body of the response for further details - for example, you may have insufficient credits remaining
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://developer.bulksms.com/json/v1/errors#insufficient-credits
            title: Insufficient Credits
            status: 403
    bad-request:
      description: Bad Request. The content or structure of your submission, or a parameter, was found to be invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://developer.bulksms.com/json/v1/errors/#bad-request
            title: Bad Request
            status: 400
            detail: 'Request body is not valid: ...'
  schemas:
    SubmissionEntry:
      description: An object that you use when posting messages.
      type: object
      required:
      - to
      - body
      properties:
        from:
          description: 'Identifies the sender.


            You can supply either a string value or a structured object.

            If you supply a string, the `type` of the sender is derived to be either INTERNATIONAL or ALPHANUMERIC.  If the value does not begin with a `+` and it contains at least one character that is not a digit, the type is detected as ALPHANUMERIC. Otherwise, the type is detected as INTERNATIONAL.

            '
          oneOf:
          - type: string
            description: 'A string sender ID (international number or alphanumeric).

              You can also supply a structured object with explicit `type` and `address` fields — use the selector above to see that format.

              If you supply a string, the `type` is derived to be either INTERNATIONAL or ALPHANUMERIC based on the value.

              '
            example: '+447911123456'
          - type: object
            required:
            - type
            properties:
              type:
                description: 'The type of the sender id.


                  If you want BulkSMS to collect replies to this message on your behalf, specify the type as REPLIABLE.  If the recipient is in a country where BulkSMS does not have a local reply number, the reply may incur costs that are more expensive than sending a local SMS in that country.

                  If you operate a service from a shortcode in a locale that allows messaging from such a shortcode, you can specify SHORTCODE for the type.

                  '
                type: string
                enum:
                - INTERNATIONAL
                - ALPHANUMERIC
                - SHORTCODE
                - REPLIABLE
              address:
                type: string
                example: '1111111'
                description: 'The address of the sender id.


                  The validation for this field depends on the value of the `type`.

                  INTERNATIONAL can start with `+`. It has a maximum length of 15 digits, and has to be longer than 6 digits.

                  ALPHANUMERIC has a maximum length of 11 characters.

                  SHORTCODE has a maximum length of 6 digits.

                  REPLIABLE should not specify a value here.

                  '
        to:
          description: 'Identifies the recipients.


            You can supply a single string (phone number), an array of strings, a single [Recipient](#model/Recipient) object, or an array of Recipient objects.

            If you supply a string, the `type` is taken as INTERNATIONAL.

            '
          oneOf:
          - type: string
            description: 'A single phone number.

              You can also supply an array of strings, a single [Recipient](#model/Recipient) object, or an array of Recipient objects — use the selector above to see each format.

              If you supply a string, the `type` is taken as INTERNATIONAL.

              '
            example: '+447700900000'
          - type: array
            description: An array of phone numbers
            items:
              type: string
            example:
            - '+447700900000'
            - '+447700900001'
          - $ref: '#/components/schemas/Recipient'
          - type: array
            description: An array of recipient objects
            items:
              $ref: '#/components/schemas/Recipient'
        routingGroup:
          description: 'Allows you to choose routing. The default is STANDARD.

            '
          type: string
          enum:
          - STANDARD
          - ECONOMY
          - PREMIUM
        encoding:
          description: 'Describes the content of the message body.


            Typically this is TEXT, which is the default if no value is provided.


            If you need to send characters that are not covered by the [GSM 03.38](https://en.wikipedia.org/wiki/GSM_03.38) character set you will need to specify UNICODE.


            If you want to send a sequence of bytes, you must use BINARY.


            You can also or use the `auto-unicode` parameter of the Send Messages Operation.


            If you supply the value of `TEXT` while `auto-unicode` is `true` then your message may be converted to `UNICODE`.


            If you supply a value other than `TEXT` for this property while `auto-unicode` is `true` then no automatic conversion will take place.

            '
          type: string
          enum:
          - TEXT
          - UNICODE
          - BINARY
        longMessageMaxParts:
          description: 'The maximum number of message parts that can be used for a [concatenated message](https://en.wikipedia.org/wiki/Concatenated_SMS).

            The default is `3`.

            '
          type: integer
          format: int32
          example: 5
        body:
          description: 'The message content as described in the `encoding`. If the `encoding` is BINARY, the body must contain only hexadecimal digits where one byte is represented as two digits. For example, if you want to send two bytes ''0x05'' and ''0x1F'', the message body must contain the text ''051F''.


            The message content can also contain templates, read the [body templates section](#tag/message) for more information.

            '
          type: string
          example: Hi there!
        userSuppliedId:
          description: 'Correlate the messages created from this submission to your data.


            The value can contain no more than 20 characters.

            '
          type: string
          example: submission-12765
        protocolId:
          description: 'The TP-PID value from GSM 03.40[.750] §9.2.3.9.


            You can provide either an integer value, or a mnemonic string.


            If unspecified, this property defaults to `0`, representing the IMPLICIT value.

            Numeric values are listed below

            | Name | Value|

            |----- |------|

            | IMPLICIT              | 00 |

            | SHORT_MESSAGE_TYPE_0  | 64 |

            | REPLACE_MESSAGE_1     | 65 |

            | REPLACE_MESSAGE_2     | 66 |

            | REPLACE_MESSAGE_3     | 67 |

            | REPLACE_MESSAGE_4     | 68 |

            | REPLACE_MESSAGE_5     | 69 |

            | REPLACE_MESSAGE_6     | 70 |

            | REPLACE_MESSAGE_7     | 71 |

            | RETURN_CALL           | 95 |

            | ME_DOWNLOAD           | 125 |

            | ME_DEPERSONALIZE      | 126 |

            | SIM_DOWNLOAD          | 127 |

            '
          type: string
          enum:
          - IMPLICIT
          - SHORT_MESSAGE_TYPE_0
          - REPLACE_MESSAGE_1
          - REPLACE_MESSAGE_2
          - REPLACE_MESSAGE_3
          - REPLACE_MESSAGE_4
          - REPLACE_MESSAGE_5
          - REPLACE_MESSAGE_6
          - REPLACE_MESSAGE_7
          - RETURN_CALL
          - ME_DOWNLOAD
          - ME_DEPERSONALIZE
          - SIM_DOWNLOAD
        messageClass:
          description: 'The class of the message, as specified by §4 of the GSM 03.38 specification.


            You can provide either an integer value, or a mnemonic string.


            The default value is SIM_SPECIFIC.

            Numeric values are

            | Name | Value|

            |------|------|

            | FLASH_SMS | 0      |

            | ME_SPECIFIC | 1    |

            | SIM_SPECIFIC | 2   |

            | TE_SPECIFIC | 3   |

            '
          type: string
          enum:
          - FLASH_SMS
          - ME_SPECIFIC
          - SIM_SPECIFIC
          - TE_SPECIFIC
        deliveryReports:
          description: 'The type of delivery reports to request from the delivering network.


            The default value  is `ALL`.

            Please note that not all networks support delivery reports.


            ALL. All possible delivery reports


            ERRORS. Only error delivery reports


            NONE. No delivery reports

            '
          type: string
          enum:
          - ALL
          - ERRORS
          - NONE
    Message:
      type: object
      required:
      - id
      - type
      - to
      - body
      - status
      properties:
        id:
          description: A unique identifier that is assigned when the message is created.
          type: string
          example: '12345'
        type:
          description: The message direction
          type: string
          enum:
          - SENT
          - RECEIVED
        from:
          description: The address part of the sender id
          type: string
          example: '+447911123456'
        to:
          description: The phone number of the recipient
          type: string
          example: '+447700900000'
        body:
          description: The content of the message
          type: string
          example: Hi there!
        encoding:
          description: The type of the content.  See the `encoding` field for more information.
          type: string
          enum:
          - TEXT
          - UNICODE
          - BINARY
        protocolId:
          description: See the `protocolId` field for more information.
          type: integer
          format: int32
        messageClass:
          description: See the `messageClass` field for more information.
          type: integer
          format: int32
        numberOfParts:
          description: The number of parts.  If this is a concatenated message, the number of parts will be more than 1.  Note that this field does not have a value in the submission response.
          type: integer
          format: int32
        creditCost:
          description: The cost of the message (in credits).   Note that this field does not have a value in the submission response.
          type: number
          format: float
        submission:
          description: 'Identifies the submission.

            '
          type: object
          required:
          - id
          - date
          properties:
            id:
              description: A unique identity shared by all messages that were created from the same submission. This field should be ignored if the `type` is not SENT.
              type: string
              example: submission-98765
            date:
              description: The date and time the submission was processed. If the `type` is RECEIVED, this field reflects the date and time the received message was processed.
              type: string
              format: date-time
        status:
          description: The status of the message
          type: object
          required:
          - id
          - type
          properties:
            id:
              description: 'A concatenated value A.B where A is the `status.type` and B is the `status.subtype`.

                It there is no value for `subtype` then B takes string value `"null"` (e.g. `"SENT.null"`).

                '
              type: string
              example: ACCEPTED.null
            type:
              description: '

                ACCEPTED  Message accepted for delivery. Only returned for initial message submissions.


                SCHEDULED  Message accepted for delivery at a later date. Only returned for initial message  submissions.


                SENT  Message has been relayed away from our systems.


                DELIVERED  Successfully delivered to phone.


                UNKNOWN  Message is in an unknown state.


                FAILED  Delivery failed.

                '
              type: string
              enum:
              - ACCEPTED
              - SCHEDULED
              - SENT
              - DELIVERED
              - UNKNOWN
              - FAILED
            subtype:
              description: 'Has a value only if the `type` is FAILED.


                EXPIRED  Delivery failed because message expired before delivery was possible.


                HANDSET_ERROR  Delivery failed because of a problem related to the phone (e.g. message storage area full).


                BLOCKED  Your account has been blocked from sending to this phone (e.g. recipient replied STOP to block communication).


                NOT_SENT  Message delivery was not attempted: either we could not find a way to deliver the message (e.g. an invalid phone number), or delivery was blocked by fraud/abuse risk filtering. Please contact Support - you may need to have a setting enabled on your account to enable this messaging.

                '
              type:
              - string
              - 'null'
              enum:
              - EXPIRED
              - HANDSET_ERROR
              - BLOCKED
              - NOT_SENT
              example: null
        relatedSentMessageId:
          description: "This field has a value only if the type is RECEIVED.\nWith SMS messages, it is not possible to link a reply directly with a specific sent message.  However, if you specified `REPLIABLE` in the `from` property, BulkSMS will link any reply to the most recent message sent to a given phone number.\n\nThe `relatedSentMessageId` property keeps the information about this link.\n\nYou can use this property to derive an implicit conversation from a set of messages.\n  - If a received reply message has a `relatedSentMessageId`, you can use it to retrieve the last message that was sent before the reply was received.\n  - If you have the `id` of the sent message and you want all the received messages that relate to it, you can use the List Related Messages Operation.\n"
          type:
          - string
          - 'null'
          example: null
        userSuppliedId:
          description: 'This is the value you supplied in the `userSuppliedId` field.

            Has a value only if the `type` is SENT.

            '
          type:
          - string
          - 'null'
          example: null
    Recipient:
      type: object
      description: A structured recipient object
      properties:
        type:
          description: Type of the recipient. The default value is INTERNATIONAL.
          type: string
          enum:
          - INTERNATIONAL
          - GROUP
        address:
          description: The phone number of the recipient.  It must be supplied if the `type` is INTERNATIONAL
          type: string
        name:
          description: The name of a group in your phonebook. A value can be given if the `type` is GROUP.
          type: string
        id:
          description: The id of a group in your phonebook.  A value can be given if the `type` is GROUP.
          type: string
        fields:
          type: array
          description: 'Custom fields that can be used in the message body. A value can be given if the `type` is INTERNATIONAL


            Read the [body templates section](#tag/message) for more information.

            '
          items:
            type: string
      example:
        type: INTERNATIONAL
        address: '1111111'
        fields:
        - Jack
        - $200.00
    Error:
      description: See the errors page at https://www.bulksms.com/developer/json/v1/errors/ for more detail on what kind of errors you can get.
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          description: A URL to one of the error types listed at https://www.bulksms.com/developer/json/v1/errors/
          type: string
        title:
          description: A short description of the type
          type: string
        status:
          description: The HTTP status code
          type: integer
          format: int32
          example: 400
        detail:
          description: More information about why the error occurred.
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'The API uses HTTP Basic Auth with an **API Token** for authentication.


        API tokens can be created by logging into your account and visiting _Settings > Developer Settings > API Tokens_.


        Supply the token ID as the username and the token secret as the password. The values must be [Base64 encoded](https://en.wikipedia.org/wiki/Base64) before using them in the `Authorization` header.


        For example, if the token ID is `BBDE1B476E03498AA768F66A286AABDC-01-B` and the token secret is `9jSbVDK20!MXdfRGiIIFu#ffUE8*S`, the unencoded header value is `BBDE1B476E03498AA768F66A286AABDC-01-B:9jSbVDK20!MXdfRGiIIFu#ffUE8*S`.  After encoding, the full header becomes


        ```

        Authorization: Basic QkJERTFCNDc2RTAzNDk4QUE3NjhGNjZBMjg2QUFCREMtMDEtQjo5alNiVkRLMjAhTVhkZlJHaUlJRnUjZmZVRTgqUw==

        ```


        You are requested to preemptively provide the `Authorization` header in your requests and not wait until the server has provided a `401 Unauthorized` response. Doing so will reduce the number of requests required to achieve your goal, which will improve overall performance.


        > **Username and password authentication is no longer supported.** Accounts created after 2026-04-29 can only authenticate with an API token. If you have a legacy integration that cannot be switched to token-based authentication, please [contact Support](https://www.bulksms.com/contact/) to request an exemption.

        '
